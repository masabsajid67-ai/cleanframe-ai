server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CLEANFRAME uses hash routing (#/workspace), so every path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets aggressively; never cache index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

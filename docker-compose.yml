services:
  backend:
    build: ./backend
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      CLEANFRAME_STORAGE_DIR: /data
    volumes:
      - cleanframe_data:/data
    restart: unless-stopped

  # Frontend is built once and served as static files (nginx).
  # For local dev use `npm run dev` in frontend/ instead.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  cleanframe_data:
